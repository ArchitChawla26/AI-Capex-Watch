name: Weekly EDGAR refresh

# Wednesdays at 13:15 UTC — mid-week, when the previous week's 10-Q/10-K
# filings have landed on EDGAR. Rebuilds the dataset from SEC filings,
# commits it, and deploys the site in one run.
# Note: a commit pushed with GITHUB_TOKEN does not trigger other workflows,
# so this workflow deploys Pages itself instead of relying on pages.yml.
on:
  schedule:
    - cron: "15 13 * * 3"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild data from SEC EDGAR
        run: python3 scripts/pull_edgar.py

      - name: Commit updated data
        run: |
          git config user.name "edgar-refresh-bot"
          git config user.email "edgar-refresh-bot@users.noreply.github.com"
          git add data/capex.json site/data/capex.json
          git diff --cached --quiet || git commit -m "Weekly EDGAR refresh $(date -u +%F)"
          git push

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
